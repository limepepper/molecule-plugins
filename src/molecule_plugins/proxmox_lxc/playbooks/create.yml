---
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  # no_log: "{{ molecule_no_log }}"
  vars:
    _proxmox_changed: false # internal flag for tracking
  vars_files:
    - vars/main.yml
  tasks:
    - name: Create Instance Config # noqa: syntax-check[unknown-module]
      instance_config:
        env_prefix: "PROXMOX_"
        driver_defaults: "{{ molecule_yml.driver.driver_defaults | default({}) }}"
        proxmox_conf: "{{ molecule_yml.driver.proxmox_conf | default({}) }}"
        platforms: "{{ molecule_yml.platforms }}"
        scenario_name: "{{ molecule_yml.scenario.name }}"
      register: instance_config

    - name: Create the Instances
      molecule_proxmox_lxc:
        proxmox_instances: "{{ instance_config.instances }}"
        proxmox_conf: "{{ instance_config.proxmox_conf }}"
        state: started
      register: server

    - name: Create instance config
      # when: server.changed | default(false) | bool # noqa no-handler
      block:
        - name: Populate instance config dict # noqa jinja
          ansible.builtin.set_fact:
            instance_conf_dict:
              "proxmox_hostname": "{{ item.proxmox_hostname }}"
              "instance": "{{ item.name }}"
              "address": "{{ item.address }}"
              "user": "{{ item.host_user }}"
              "port": "{{ item.host_port }}"
              "vmid": "{{ item.vmid }}"
              "identity_file": "{{ item.identity_file }}"
          with_items: "{{ server.results }}"
          register: instance_config_dict

        - name: Instance_config_dict
          ansible.builtin.debug:
            var: instance_config_dict

        - name: Convert instance config dict to a list
          ansible.builtin.set_fact:
            instance_conf: "{{ instance_config_dict.results | map(attribute='ansible_facts.instance_conf_dict') | list }}"

        - name: Dump instance config
          ansible.builtin.copy:
            content: |
              # Molecule managed

              {{ instance_conf | to_json | from_json | to_yaml }}
            dest: "{{ molecule_instance_config }}"
            mode: "0600"
