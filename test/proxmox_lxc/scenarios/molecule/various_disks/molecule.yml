---
driver:
  name: molecule-proxmox-lxc
dependency:
  name: galaxy
platforms:
  - name: instance
    ostemplate: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    disk: "local-lvm-thin:20"
  - name: instance2
    ostemplate: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    storage: "local-lvm-thin"
  - name: instance3
    ostemplate: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    storage: "local-zfs"
provisioner:
  name: ansible
  config_options:
    defaults:
      verbosity: 2
      stdout_callback: yaml
      diff: true
