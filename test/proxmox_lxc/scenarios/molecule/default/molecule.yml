---
driver:
  name: molecule-proxmox-lxc
  property: value
dependency:
  name: galaxy
platforms:
  - name: instance1
    type: clone
    clone_from_name: tmpl-rocky-9-default-v1
  - name: instance2
    ostemplate: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    storage: "local-lvm-thin"
provisioner:
  name: ansible
  config_options:
    defaults:
      verbosity: 2
      stdout_callback: yaml
      # callbacks_enabled: ansible.posix.profile_tasks
      diff: true
