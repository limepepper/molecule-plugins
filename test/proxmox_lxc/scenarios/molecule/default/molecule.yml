---
driver:
  name: molecule-proxmox-lxc
  property: value
dependency:
  name: galaxy
platforms:
  - name: instance1
    type: clone
    clone_from_name: tmpl-rocky-9-default-v3
    update: true
    netif:
      net0: "name=eth0,ip=dhcp,bridge=vmbr0,firewall=1,tag=11"
  - name: instance2
    ostemplate: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    storage: "local-lvm-thin"
    hookscript: "local:snippets/vm_hook.sh"
    netif:
      net0: "name=eth0,ip=dhcp,bridge=vmbr0,firewall=1,tag=11"
provisioner:
  name: ansible
  config_options:
    defaults:
      verbosity: 2
      stdout_callback: yaml
      # callbacks_enabled: ansible.posix.profile_tasks
      diff: true
